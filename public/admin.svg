<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16"/>
  <defs>
    <style type="text/css">
      .stroke-main { stroke: #334155; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-body { fill: #FFFFFF; }
      .accent-blue { stroke: #3B82F6; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Cabello Admin Moderno -->
    <path class="stroke-main" d="M90,95 C85,45 100,35 140,35 C180,35 195,45 190,95" />
    <path class="stroke-main" d="M90,95 C92,110 110,105 115,115" />
    <path class="stroke-main" d="M190,95 C188,110 170,105 165,115" />
    <!-- Rostro -->
    <path class="stroke-main fill-body" d="M115,115 C115,150 120,170 140,170 C160,170 165,150 165,115" />
    <!-- Gafas de Administrador -->
    <rect x="110" y="112" width="24" height="18" rx="4" class="stroke-main" />
    <rect x="146" y="112" width="24" height="18" rx="4" class="stroke-main" />
    <line x1="134" y1="120" x2="146" y2="120" class="stroke-main" />
    <!-- Cuello y Ropa Confortable (Polo/Camiseta) -->
    <path class="stroke-main" d="M122,165 L122,190" />
    <path class="stroke-main" d="M158,165 L158,190" />
    <path class="stroke-main fill-body" d="M48,220 C48,200 65,185 95,185 L185,185 C215,185 232,200 232,220 L232,260 L48,260 Z" />
    <!-- Cuello Redondo de Acento -->
    <path class="accent-blue" d="M115,185 C115,200 165,200 165,185" />

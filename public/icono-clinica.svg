<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="100%"
  height="100%"
>
  <!-- 1. El contenedor azul -->
  <rect x="0" y="0" width="24" height="24" rx="7" fill="#2563eb" />

  <!-- 2. Figuras blancas agrandadas -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Usuario Izquierdo (Más grande y desplazado hacia el borde) -->
    <circle cx="7.5" cy="11" r="2.1" />
    <path d="M3.5 17.5a3 3 0 0 1 6 0" />

    <!-- Usuario Derecho (Más grande y depejado hacia el borde) -->
    <circle cx="16.5" cy="11" r="2.1" />
    <path d="M14.5 17.5a3 3 0 0 1 6 0" />

    <!-- Usuario Central (Agrandado en el centro superior) -->
    <circle cx="12" cy="9" r="2.6" fill="#2563eb" />
    <path d="M6.5 18.5a5.5 5.5 0 0 1 11 0" fill="#2563eb" />
  </g>
</svg>
